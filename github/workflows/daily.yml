name: mbm-nfl-daily
on:
  schedule:
    - cron: "0 13 * * *"     # daily board/grade
    - cron: "0 17 * * 0"     # Sunday pre-slate refresh (latest starters/injuries)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python daily_nfl.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit state
        run: |
          mkdir -p logs && date > logs/last_run.txt
          git config user.name mbm-bot && git config user.email bot@mbm
          git add data/ logs/ && git diff --cached --quiet || git commit -m "nfl $(date +%F)"
          git push
