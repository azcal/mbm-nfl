name: mbm-nfl-props-weekly
# GitHub starts scheduled runs late on this repo: 3 to 5.5 hours on Sundays and up to 7.5 hours
# midweek (Sep-Nov 2026). The 14:30 UTC Sunday run kept landing after the early kickoffs, so the
# Unabated file skipped every early game. Both projection runs are now set early enough that a
# late start still beats the first kickoff. A manual run (Run workflow) starts right away.
# Sunday 05:30 UTC (Sat 10:30pm MST): full week, fresh prices for every game not yet final.
# Thursday 06:00 UTC (Wed 11pm MST): same projections, prices for games in the next 48 hours
# (TNF; Thanksgiving week, all three Thursday games and Black Friday).
# Tuesday 15:15 UTC: validation of Sunday's injury tags against snap counts. A manual run does both.
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (America/Edmonton): week=sun@06:00,thu=thu@09:00,validate=tue@08:15
    # week = Sunday 6am full slate, thu = Thursday 9am next 48 hours, validate = Tuesday grading.
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/props_weekly.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "week=sun@06:00,thu=thu@09:00,validate=tue@08:15"
          SLOT_MARKER: ".slots/props_weekly.txt"
          SLOT_EVENT: ${{ github.event_name }}
  props:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests pyarrow scipy tzdata
      - name: validate last grid (Tuesday)
        if: needs.gate.outputs.name == 'validate' || needs.gate.outputs.name == 'manual'
        run: python props_validate.py || true
      - name: slate regression test
        run: python test_props_slate.py
      - name: name matching test
        run: python tests/test_props_names.py
      - name: odds conversion test
        run: python tests/test_props_odds.py
      - name: project this week (Sunday)
        if: needs.gate.outputs.name != 'validate'
        run: python props_weekly.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPS_ALTS: "0"        # "1" adds the alternate markets: doubles the credits per game
          PROPS_WINDOW_H: ${{ needs.gate.outputs.name == 'thu' && '48' || '' }}   # Thursday run: games in the next 48h only
      # UNTESTED rushing and passing means for the Unabated file (added Nov 20, 2026). A failure
      # here only leaves those columns blank; the receiving grid, board and export carry on.
      - name: rushing and passing means (untested)
        if: needs.gate.outputs.name != 'validate'
        continue-on-error: true
        run: python props_rushpass.py
        env:
          PROPS_WINDOW_H: ${{ needs.gate.outputs.name == 'thu' && '48' || '' }}
      # Paper-only joint sim: totals, team totals, and the rushing and passing ladders built on
      # the grid the step above just wrote. Posts one grey embed for today's and tomorrow's games.
      - name: joint sim ladders (paper)
        if: needs.gate.outputs.name != 'validate'
        continue-on-error: true
        run: python sim_nfl.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SIM_POST: "1"
      - name: commit grid and board
        run: |
          git config user.name "mbm-nfl"
          git config user.email "mbm-nfl@users.noreply.github.com"
          git add logs data/odds
          git commit -m "props grid $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
      # The export runs after the grid and board are committed, so a failed export leaves them in
      # place and still shows as a red X here. Not on the Tuesday validation run.
      - name: Unabated export
        if: needs.gate.outputs.name != 'validate'
        run: python props_unabated.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit export
        if: needs.gate.outputs.name != 'validate'
        run: |
          git add -A logs/unabated templates
          git commit -m "unabated export $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/props_weekly.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/props_weekly.txt
          git commit -q -m "slot props_weekly ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"
