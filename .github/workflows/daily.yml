name: mbm-nfl-daily
# Board lands mid-morning with a late-afternoon refresh that only reports what moved.
# The afternoon run is the one that matters here: it is the Sunday pre-slate check, and
# it is where a QB ruled Out on the injury report reprices the board.
# Timing: an hourly tick plus slot_gate.py, which works in Mountain time.
on:
  schedule:
    # Hourly tick. slot_gate.py decides whether a tick is a board run: GitHub starts
    # scheduled jobs hours late, so a fixed cron time cannot be trusted. See slot_gate.py.
    # Board times (Mountain time, daylight saving handled by the gate): am=09:00,pm=16:00
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Post the full board even if nothing repriced since the last run"
        type: boolean
        default: true
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            logs/last_slot.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "am=09:00,pm=16:00"
          SLOT_MARKER: "logs/last_slot.txt"
          SLOT_EVENT: ${{ github.event_name }}
  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # Import-only check: fails in seconds on a missing module or a syntax error,
      # instead of after the full-season play-by-play parquet has downloaded.
      # Also where a stale shared file is caught: the runner checks the version of
      # board_format, notify and tg_delta at import.
      - run: python -c "import daily_nfl"
      - run: python daily_nfl.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # The quotes matter. "@" starts a reserved indicator in YAML, so a bare
          # @everyone here is a parse error and GitHub hides the whole workflow.
          DISCORD_MENTION: "@everyone"
          # Manual runs post the whole board. Scheduled runs do not, so the 9am cron is
          # the first-of-day full push and the 4pm cron sends only the games whose spread
          # pick moved, which is usually a QB change.
          #
          # The chain short-circuits on the event name, so a scheduled run never reads the
          # inputs context at all. False yields an empty string, and tg_delta only treats
          # "1", "true" or "yes" as set, so an empty value is the same as unset.
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push && '1' || '' }}
          # Which cron fired. The runner needs this to hold a weekly cadence during the
          # Week 1 run-up: Actions cannot express "weekly until a date, then twice daily",
          # so both crons keep firing every day and daily_nfl.py decides whether to work.
          #
          # workflow_dispatch resolves to "manual", which always runs in full. That is the
          # override: any time you want a board on a non-Tuesday, run it by hand.
          MBM_SLOT: ${{ needs.gate.outputs.name }}
          # The Odds API. A repository secret is NOT visible to a step unless it is named
          # here, so adding the secret alone left the runner reading an empty string and
          # falling back to model lines on every game while the credit counter stayed at 0.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Mirror picks.csv into a separate public repo. Push from here rather than pull from
      # there: no schedule to keep in sync, and the file lands the moment it is generated.
      #
      # Both PICKS_REPO and the token must be set or the step no-ops. That is deliberate,
      # so this workflow keeps working unchanged in a fork or before the secret exists.
      - name: publish picks
        env:
          PICKS_TOKEN: ${{ secrets.PICKS_REPO_TOKEN }}
          # owner/repo of the PUBLIC repo. Edit this line, leave it empty to disable.
          PICKS_REPO: ""
        run: |
          set -e
          if [ -z "$PICKS_TOKEN" ] || [ -z "$PICKS_REPO" ]; then
            echo "publish target not configured, skipping"
            exit 0
          fi
          if [ ! -f logs/picks.csv ]; then
            echo "no picks.csv this run (cadence skip or empty board)"
            exit 0
          fi
          TMP=$(mktemp -d)
          git clone --quiet --depth 1 \
            "https://x-access-token:$PICKS_TOKEN@github.com/$PICKS_REPO.git" "$TMP/pub"
          mkdir -p "$TMP/pub/data"
          cp logs/picks.csv "$TMP/pub/data/picks.csv"
          cp logs/picks_README.md "$TMP/pub/data/README.md"
          cd "$TMP/pub"
          git config user.name mbm-bot
          git config user.email bot@mbm
          git add data
          if git diff --cached --quiet; then
            echo "picks unchanged, nothing published"
            exit 0
          fi
          git commit -q -m "picks $(date -u +%Y-%m-%d\ %H:%M)Z"
          git push -q
          echo "published to $PICKS_REPO"

      # Two things the original commit step got wrong.
      #
      # It failed outright when the remote had moved since checkout, which happens whenever
      # a deploy overlaps a scheduled run. This version keeps a copy of what the run
      # produced, resets onto the remote, restores the copy and retries.
      #
      # It also failed when a path was in .gitignore, because `git add` returns non-zero on
      # an ignored path and `set -e` killed the step. This repo commits data/, because
      # games.csv is rewritten by fetch_games and the two EPA parquets accumulate the
      # current season's play-by-play each run. logs/ matters just as much:
      # predictions.csv and push_cache.json live there, and without them every run would
      # push the full board as if it were the first of the day.
      - name: commit state
        env:
          SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          set -e
          mkdir -p logs && date > logs/last_run.txt
          # Record the slot so later ticks skip it. Written only here, so a failed run retries.
          if [ -n "$SLOT" ] && [ "$SLOT" != "manual" ]; then echo "$SLOT" > logs/last_slot.txt; fi
          git config user.name mbm-bot
          git config user.email bot@mbm
          TRACK=""
          for p in data logs; do
            [ -d "$p" ] || continue
            if git check-ignore -q "$p"; then
              echo "$p is gitignored, not committing it"
            else
              TRACK="$TRACK $p"
            fi
          done
          if [ -z "$TRACK" ]; then
            echo "nothing tracked to commit"
            exit 0
          fi
          TMP=$(mktemp -d)
          cp -r $TRACK "$TMP"/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git add $TRACK
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -q -m "$(basename $GITHUB_REPOSITORY) $(date +%F)"
            if git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "remote moved, re-basing this run's output onto it (attempt $i)"
            git fetch -q origin
            git reset -q --hard origin/${GITHUB_REF_NAME}
            for p in $TRACK; do cp -r "$TMP/$p" . 2>/dev/null || true; done
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
